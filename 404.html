<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // GitHub Pages SPA redirect: redirect 404 to index.html
    sessionStorage.setItem('redirect', window.location.href);
    window.location.replace(window.location.origin + window.location.pathname.split('/').slice(0, -1).join('/') + '/');
  </script>
</head>
<body></body>
</html>
